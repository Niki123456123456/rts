<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#202420" />
    <title>Stronghold</title>
    <style>
      html, body, #game-container { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #202420; }
      #game { display: block; width: 100%; height: 100%; outline: none; }
      #status { position: fixed; inset: 0; display: grid; place-content: center; padding: 24px; color: #eee; font: 18px system-ui, sans-serif; text-align: center; pointer-events: none; }
      #status[hidden] { display: none; }
    </style>
  </head>
  <body>
    <main id="game-container"><canvas id="game" tabindex="0" aria-label="Stronghold Spiel"></canvas></main>
    <div id="status" role="status">Spiel wird geladen …</div>
    <script type="module">
      import "./network.js";
      import init from "./stronghold_game.js";
      const canvas = document.querySelector("#game");
      const status = document.querySelector("#status");
      canvas.addEventListener("contextmenu", event => event.preventDefault());
      canvas.addEventListener("pointerdown", () => canvas.focus());
      try {
        await init();
        status.hidden = true;
        canvas.focus();
      } catch (error) {
        console.error(error);
        status.textContent = "Das Spiel konnte nicht gestartet werden. Bitte verwende einen aktuellen Browser mit WebGL 2-Unterstützung.";
      }
    </script>
  </body>
</html>
