name: Build and publish game

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev libx11-dev pkg-config
      - name: Install Rust
        working-directory: game
        run: rustup show active-toolchain
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game/web/package-lock.json
      - name: Cache Rust dependencies and builds
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/wasm-bindgen*
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
            game/target
            server/target
          key: ${{ runner.os }}-web-${{ hashFiles('game/Cargo.lock', 'game/Cargo.toml', 'server/Cargo.lock', 'server/Cargo.toml', 'game/rust-toolchain.toml') }}
      - name: Check multiplayer server
        working-directory: server
        run: cargo fmt --check && cargo test --lib --locked && cargo fmt --manifest-path ../shared/Cargo.toml --check && cargo test --manifest-path ../shared/Cargo.toml --locked && cargo build --locked --release --target wasm32-unknown-unknown
      - name: Install SpacetimeDB 1.1.2 code generator
        run: |
          mkdir -p "$RUNNER_TEMP/spacetime"
          curl --fail --show-error --location --retry 3 \
            https://github.com/clockworklabs/SpacetimeDB/releases/download/v1.1.2/spacetime-x86_64-unknown-linux-gnu.tar.gz \
            --output "$RUNNER_TEMP/spacetime.tar.gz"
          tar -xzf "$RUNNER_TEMP/spacetime.tar.gz" -C "$RUNNER_TEMP/spacetime"
          ln -s "$RUNNER_TEMP/spacetime/spacetimedb-cli" "$RUNNER_TEMP/spacetime/spacetime"
          echo "$RUNNER_TEMP/spacetime" >> "$GITHUB_PATH"
      - name: Generate client bindings
        run: bash server/generate-bindings.sh
      - name: Check formatting and test
        working-directory: game
        env:
          CARGO_PROFILE_TEST_DEBUG: "0"
        run: cargo fmt --check && cargo test --locked
      - name: Build browser game
        env:
          SPACETIMEDB_URI: ${{ vars.SPACETIMEDB_URI || 'http://127.0.0.1:3000' }}
          SPACETIMEDB_DATABASE: ${{ vars.SPACETIMEDB_DATABASE || 'stronghold-terrain' }}
        run: bash game/build-web.sh
      - name: Upload Pages site
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && vars.SPACETIMEDB_URI != '' && vars.SPACETIMEDB_DATABASE != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Publish game
        id: deployment
        uses: actions/deploy-pages@v4
