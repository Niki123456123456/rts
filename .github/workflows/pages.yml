name: Build and publish game

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev pkg-config
      - name: Install Rust
        working-directory: game
        run: rustup show active-toolchain
      - name: Cache Rust dependencies and builds
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/wasm-bindgen*
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
            game/target
          key: ${{ runner.os }}-web-${{ hashFiles('game/Cargo.lock', 'game/Cargo.toml', 'game/rust-toolchain.toml') }}
      - name: Check formatting and test
        working-directory: game
        env:
          CARGO_PROFILE_TEST_DEBUG: "0"
        run: cargo fmt --check && cargo test --locked
      - name: Build browser game
        run: bash game/build-web.sh
      - name: Upload Pages site
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Publish game
        id: deployment
        uses: actions/deploy-pages@v4
